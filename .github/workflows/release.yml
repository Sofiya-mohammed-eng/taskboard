name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          IMAGE_BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --target runtime -t "${IMAGE_BASE}-api:${GITHUB_REF_NAME}" ./api
          docker build -t "${IMAGE_BASE}-frontend:${GITHUB_REF_NAME}" ./frontend
          docker push "${IMAGE_BASE}-api:${GITHUB_REF_NAME}"
          docker push "${IMAGE_BASE}-frontend:${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
