name: taskboard-release

services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/sofiya-mohammed-eng/taskboard-api:${TAG:?TAG is required, for example v0.1.0}
    platform: linux/amd64
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/sofiya-mohammed-eng/taskboard-frontend:${TAG:?TAG is required, for example v0.1.0}
    platform: linux/amd64
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
